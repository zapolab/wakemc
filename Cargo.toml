[package]
name = "wakemc"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "wakemc"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "io-util", "process", "signal", "sync", "time", "rt-multi-thread"] }
toml = "0.8"
libc = "0.2"
